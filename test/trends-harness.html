<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FitCoach trends preview</title>
<link rel="stylesheet" href="../style.css?v=40">
<style>
 body.trend-shot{padding-bottom:12px}
 body.trend-shot header,body.trend-shot nav,body.trend-shot #toast,body.trend-shot #iosb{display:none !important}
 body.trend-shot #food > :not(#trends){display:none !important}
 body.trend-shot main{padding-top:6px}
 #copyshot[hidden]{display:none}
 #copyshot{position:fixed;inset:0;z-index:80;background:#121212;color:#fff;padding:18px 16px 24px;overflow:auto}
 #copyshot h2{font-size:22px;margin:8px 0 4px}
 #copyshot p{color:#8e8e93;font-size:13px;margin:0 0 12px}
 #copyshot pre{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.45;color:#f2f2f7;margin:0}
</style>
<script>
(function(){
  var mem=new Map();
  var fake={
    getItem:function(k){return mem.has(k)?mem.get(k):null},
    setItem:function(k,v){mem.set(String(k),String(v))},
    removeItem:function(k){mem.delete(k)},
    clear:function(){mem.clear()},
    key:function(i){return Array.from(mem.keys())[i]||null},
    get length(){return mem.size}
  };
  window.__trendShim=false;
  try{
    Object.defineProperty(window,'localStorage',{configurable:true,get:function(){return fake}});
    window.__trendShim=true;
  }catch(e){window.__trendShim=false}
  try{
    window.indexedDB={open:function(){var r={};setTimeout(function(){if(r.onerror)r.onerror(new Event('error'))},0);return r},deleteDatabase:function(){return {}}};
  }catch(e){}
})();
</script>
</head>
<body class="trend-shot">
<header>FitCoach</header>
<main><section id="food" class="tab"></section><section id="workout" class="tab" hidden></section><section id="cond" class="tab" hidden></section><section id="progress" class="tab" hidden></section><section id="settings" class="tab" hidden></section></main>
<nav><button data-t="food">Food<span>Food</span></button></nav>
<div id="kp" hidden></div><div id="modal" hidden></div>
<div id="copyshot" hidden><h2>Copied for your coach</h2><p>Plain text on the clipboard</p><pre></pre></div>
<script>
(function(){
  if(!window.__trendShim){
    document.body.innerHTML='<p style="color:#fff;font:16px sans-serif;padding:24px">This preview did not start, so it will not touch saved FitCoach data.</p>';
    return;
  }
  var files=['data.js','body.js','cond.js','goals.js','meals.js','slots.js','edit.js','trends.js','app.js','scan.js'];
  var i=0;
  function next(){
    if(i>=files.length){seed();return}
    var s=document.createElement('script');
    s.src='../'+files[i]+'?v=40';
    s.onload=function(){i++;next()};
    s.onerror=function(){document.body.insertAdjacentHTML('beforeend','<p style="color:#ffb340;padding:16px">Could not load '+files[i]+'</p>')};
    document.body.appendChild(s);
  }
  function at(iso,hh,mm){var p=iso.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],hh,mm||0).getTime()}
  function ent(date,name,slot,kcal,p,hh,mm){return {name:name,slot:slot,kcal:kcal,p:p,c:0,f:0,g:100,t:at(date,hh,mm)}}
  function splitDay(date,kcal,p){
    var bK=Math.round(kcal*0.28),lK=Math.round(kcal*0.36),sK=Math.round(kcal*0.08),dK=kcal-bK-lK-sK;
    var bP=Math.round(p*0.30),lP=Math.round(p*0.36),sP=Math.round(p*0.08),dP=p-bP-lP-sP;
    return [
      ent(date,'Greek yogurt and oats','b',bK,bP,7,40),
      ent(date,'Chicken and rice','l',lK,lP,12,20),
      ent(date,'Salmon and potatoes','d',dK,dP,18,10),
      ent(date,'Protein bar','s',sK,sP,15,35)
    ];
  }
  function ago(iso,end){return Math.round((trendDate(end)-trendDate(iso))/86400000)}
  function seed(){
    var end=today(),log={},d7=trendDates(end,7),prior=trendDates(trendShift(end,-7),7),status={};
    log[d7[0]]=splitDay(d7[0],2400,100);
    status[d7[1]]='none';
    log[d7[2]]=[ent(d7[2],'Sample oats','b',900,40,8,0)];
    status[d7[2]]='partial';
    log[d7[3]]=splitDay(d7[3],1600,140);
    status[d7[3]]='complete';
    log[d7[5]]=splitDay(d7[5],1800,150);
    status[d7[5]]='complete';
    log[d7[6]]=[ent(d7[6],'Sample bar','s',400,20,21,0)];
    var weights=prior.concat(d7).map(function(d,i){return {d:d,w:i<7?185.4:184.6}});
    S.settings.kcal=1720;
    S.settings.p=145;
    S.log=log;
    S.weights=weights;
    S.logStatus=status;
    S.cycleDays={};
    S.cycleDays[d7[3]]=1;
    S.holiday50={v:1,days:{},weeks:{},flex:[],steps:{}};
    S.holiday50.days[d7[3]]={privateNote:'Sample private line'};
    var keep=S.custom&&S.custom.slice();
    renderFood();
    if(keep&&S.custom.length<keep.length)throw new Error('seed dropped custom foods');
    var M=trendBuild(S,end,7);
    if(Math.round(M.avgKcal)!==1700||M.avgN!==2||M.cov.complete!==2||M.cov.partial!==1||M.cov.none!==1||M.cov.unknown!==3)throw new Error('sample did not match the preview checks');
    if(M.cur.some(function(d){return d.kcal>=2400&&d.status!=='unknown'}))throw new Error('unknown day was treated as complete');
    document.documentElement.dataset.ready='1';
  }
  next();
})();
</script>
</body>
</html>
